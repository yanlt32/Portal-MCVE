<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meditação Diária - AVIVA</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <meta name="theme-color" content="#2563eb"/>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-light: #dbeafe;
      --text: #1f2937;
      --text-muted: #6b7280;
      --bg: #f1f5f9;
      --card: #ffffff;
      --border: #e5e7eb;
      --success: #10b981;
      --warning: #f59e0b;
      --shadow: 0 4px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 10px 24px rgba(0,0,0,0.1);
    }
    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1rem; }

    /* Header da página */
    .page-header {
      background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 50%, #2563eb 100%);
      padding: 1.5rem 1rem;
      text-align: center;
      box-shadow: 0 4px 20px rgba(37,99,235,0.3);
      margin-bottom: 1.5rem;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: rgba(255,255,255,0.9);
      text-decoration: none;
      font-weight: 600;
      margin-bottom: 1rem;
      padding: 0.6rem 1.2rem;
      border-radius: 50px;
      background: rgba(255,255,255,0.15);
      transition: all 0.25s;
      border: 1px solid rgba(255,255,255,0.25);
      font-size: 0.9rem;
    }
    .back-btn:hover { background: rgba(255,255,255,0.25); transform: translateY(-1px); }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: #ffffff;
      margin-bottom: 0.3rem;
    }
    .subtitle { font-size: 1rem; color: rgba(255,255,255,0.85); margin-bottom: 0.3rem; }
    .description { font-size: 0.9rem; color: rgba(255,255,255,0.75); max-width: 550px; margin: 0 auto; }

    /* Filtros */
    .filters-section {
      background: var(--card);
      border-radius: 14px;
      padding: 1.2rem;
      margin-bottom: 1.2rem;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .filters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.8rem;
      margin-bottom: 0.8rem;
    }
    .search-box { position: relative; margin-bottom: 0.8rem; }
    .search-box input {
      width: 100%;
      padding: 0.7rem 1rem 0.7rem 2.8rem;
      border: 1px solid var(--border);
      border-radius: 50px;
      background: #f8fafc;
      color: var(--text);
      font-size: 0.95rem;
      font-family: 'Montserrat', sans-serif;
      transition: all 0.25s;
    }
    .search-box input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    .search-box i { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    .filter-group { display: flex; flex-direction: column; gap: 0.3rem; }
    .filter-group label { font-weight: 600; font-size: 0.8rem; color: var(--text-muted); }
    .filter-group select {
      padding: 0.65rem 0.8rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #f8fafc;
      color: var(--text);
      font-size: 0.9rem;
      font-family: 'Montserrat', sans-serif;
    }
    .filter-group select:focus { outline: none; border-color: var(--primary); }
    .stats { display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; margin-top: 0.8rem; }
    .stat-item {
      background: var(--primary-light);
      color: var(--primary);
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
    }

    /* Grid de Vídeos */
    .videos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.2rem;
      margin-top: 1.2rem;
    }
    .video-card {
      background: var(--card);
      border-radius: 14px;
      overflow: hidden;
      transition: all 0.25s;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      animation: fadeIn 0.5s ease-out;
    }
    .video-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--primary); }
    .video-thumbnail {
      width: 100%;
      height: 160px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 2.5rem;
      position: relative;
    }
    .video-duration {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0,0,0,0.75);
      color: white;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .video-category {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(16,185,129,0.9);
      color: white;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .video-info { padding: 1.2rem; }
    .video-title { font-size: 1.05rem; margin-bottom: 0.5rem; color: var(--text); font-weight: 600; }
    .video-description { color: var(--text-muted); margin-bottom: 0.8rem; font-size: 0.85rem; line-height: 1.5; }
    .video-meta { display: flex; justify-content: space-between; margin-bottom: 0.8rem; font-size: 0.8rem; color: var(--text-muted); }
    .play-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.7rem 1.2rem;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.25s;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      font-family: 'Montserrat', sans-serif;
    }
    .play-btn:hover { background: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(37,99,235,0.3); }

    /* Modal Player */
    .video-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .video-modal-content {
      background: #ffffff;
      border-radius: 16px;
      padding: 1.5rem;
      width: 90%;
      max-width: 860px;
      position: relative;
      box-shadow: 0 25px 50px rgba(0,0,0,0.25);
      border: 1px solid var(--border);
    }
    .close-modal {
      position: absolute;
      top: 12px;
      right: 16px;
      font-size: 1.6rem;
      color: var(--text-muted);
      cursor: pointer;
      z-index: 1001;
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .close-modal:hover { background: #fee2e2; color: #ef4444; }
    .video-player { width: 100%; height: 450px; border-radius: 10px; background: #000; }
    .video-modal-info { margin-top: 1rem; }
    .video-modal-title { font-size: 1.3rem; margin-bottom: 0.4rem; color: var(--text); font-weight: 600; }
    .video-modal-description { color: var(--text-muted); font-size: 0.9rem; }

    /* Estados Vazios */
    .empty-state { text-align: center; padding: 3rem 1.5rem; color: var(--text-muted); }
    .empty-state i { font-size: 3rem; margin-bottom: 0.8rem; color: var(--primary); opacity: 0.5; display: block; }
    .empty-state h3 { font-size: 1.2rem; margin-bottom: 0.4rem; color: var(--text); }

    /* Categorias */
    .categories-grid { display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; margin: 1rem 0; }
    .category-btn {
      background: #f8fafc;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 1.2rem;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.25s;
      font-weight: 600;
      font-size: 0.85rem;
      font-family: 'Montserrat', sans-serif;
    }
    .category-btn.active, .category-btn:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Loading */
    .loading { text-align: center; padding: 2.5rem; color: var(--text-muted); }
    .loading-spinner {
      border: 3px solid var(--border);
      border-radius: 50%;
      border-top: 3px solid var(--primary);
      width: 36px; height: 36px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 0.8rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      .container { padding: 1rem; }
      h1 { font-size: 1.7rem; }
      .videos-grid { grid-template-columns: 1fr; gap: 0.8rem; }
      .video-player { height: 240px; }
      .filters-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="page-header">
    <a href="/" class="back-btn">
      <i class="fas fa-arrow-left"></i> Voltar
    </a>
    <h1>Meditação Diária</h1>
    <p class="subtitle">Encontre paz e renovação para sua alma</p>
    <p class="description">Momentos de conexão com Deus através de meditações curtas e poderosas.</p>
  </div>
  <div class="container">

    <!-- Filtros e Estatísticas -->
    <div class="filters-section">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Buscar meditações...">
      </div>
      
      <div class="filters-grid">
        <div class="filter-group">
          <label for="categoryFilter"><i class="fas fa-tags"></i> Categoria</label>
          <select id="categoryFilter">
            <option value="">Todas as categorias</option>
            <option value="Paz">Paz</option>
            <option value="Renovação">Renovação</option>
            <option value="Fé">Fé</option>
            <option value="Gratidão">Gratidão</option>
            <option value="Esperança">Esperança</option>
          </select>
        </div>
        
        <div class="filter-group">
          <label for="durationFilter"><i class="fas fa-clock"></i> Duração</label>
          <select id="durationFilter">
            <option value="">Todas as durações</option>
            <option value="30 seg">Até 30 segundos</option>
            <option value="1 min">1 minuto</option>
            <option value="2 min">2 minutos</option>
            <option value="5 min">5 minutos ou mais</option>
          </select>
        </div>
        
        <div class="filter-group">
          <label for="sortFilter"><i class="fas fa-sort"></i> Ordenar por</label>
          <select id="sortFilter">
            <option value="newest">Mais recentes</option>
            <option value="oldest">Mais antigos</option>
            <option value="title">Título (A-Z)</option>
          </select>
        </div>
      </div>

      <div class="stats" id="statsContainer">
        <!-- Estatísticas serão carregadas via JavaScript -->
      </div>
    </div>

    <!-- Categorias Rápidas -->
    <div class="categories-grid" id="categoriesContainer">
      <!-- Categorias serão carregadas via JavaScript -->
    </div>

    <!-- Grid de Vídeos -->
    <div class="videos-grid" id="videosContainer">
      <div class="loading">
        <div class="loading-spinner"></div>
        <p>Carregando meditações...</p>
      </div>
    </div>

    <!-- Modal do Player de Vídeo -->
    <div id="videoModal" class="video-modal">
      <div class="video-modal-content">
        <span class="close-modal" onclick="closeVideoModal()">&times;</span>
        <div id="videoPlayerContainer">
          <!-- Player de vídeo será carregado aqui -->
        </div>
        <div class="video-modal-info" id="videoModalInfo">
          <!-- Informações do vídeo serão carregadas aqui -->
        </div>
      </div>
    </div>
  </div>

  <script>
    let allVideos = [];
    let currentFilter = 'all';
    let currentSearch = '';
    let currentCategory = '';
    let currentDuration = '';
    let currentSort = 'newest';

    // Inicializar a página
    document.addEventListener('DOMContentLoaded', function() {
      loadVideosFromServer();
      setupEventListeners();
    });

    // Carregar vídeos do servidor
    async function loadVideosFromServer() {
      try {
        const response = await fetch('/api/data');
        if (!response.ok) {
          throw new Error('Erro ao carregar dados do servidor');
        }
        
        const data = await response.json();
        allVideos = data.meditacaoDiaria || [];
        
        renderVideos();
        updateStats();
        renderCategories();
        
      } catch (error) {
        console.error('Erro ao carregar vídeos:', error);
        showErrorMessage('Erro ao carregar meditações. Tente novamente mais tarde.');
      }
    }

    // Configurar event listeners
    function setupEventListeners() {
      // Busca
      document.getElementById('searchInput').addEventListener('input', function(e) {
        currentSearch = e.target.value;
        renderVideos();
        updateStats();
      });

      // Filtros
      document.getElementById('categoryFilter').addEventListener('change', function(e) {
        currentCategory = e.target.value;
        renderVideos();
        updateStats();
      });

      document.getElementById('durationFilter').addEventListener('change', function(e) {
        currentDuration = e.target.value;
        renderVideos();
        updateStats();
      });

      document.getElementById('sortFilter').addEventListener('change', function(e) {
        currentSort = e.target.value;
        renderVideos();
      });
    }

    function renderVideos() {
      const container = document.getElementById('videosContainer');
      
      // Mostrar loading se ainda não carregou
      if (allVideos.length === 0) {
        container.innerHTML = `
          <div class="loading">
            <div class="loading-spinner"></div>
            <p>Carregando meditações...</p>
          </div>
        `;
        return;
      }

      let filteredVideos = [...allVideos];

      // Aplicar filtros
      if (currentSearch) {
        filteredVideos = filteredVideos.filter(video => 
          video.titulo.toLowerCase().includes(currentSearch.toLowerCase()) ||
          video.descricao.toLowerCase().includes(currentSearch.toLowerCase())
        );
      }

      if (currentCategory) {
        filteredVideos = filteredVideos.filter(video => 
          video.categoria === currentCategory
        );
      }

      if (currentDuration) {
        if (currentDuration === '30 seg') {
          filteredVideos = filteredVideos.filter(video => video.duracao === '30 seg');
        } else if (currentDuration === '1 min') {
          filteredVideos = filteredVideos.filter(video => video.duracao === '1 min');
        } else if (currentDuration === '2 min') {
          filteredVideos = filteredVideos.filter(video => video.duracao === '2 min');
        } else if (currentDuration === '5 min') {
          filteredVideos = filteredVideos.filter(video => 
            video.duracao === '5 min' || parseInt(video.duracao) >= 5
          );
        }
      }

      // Aplicar ordenação
      filteredVideos.sort((a, b) => {
        if (currentSort === 'newest') {
          return new Date(b.data) - new Date(a.data);
        } else if (currentSort === 'oldest') {
          return new Date(a.data) - new Date(b.data);
        } else if (currentSort === 'title') {
          return a.titulo.localeCompare(b.titulo);
        }
        return 0;
      });

      // Renderizar vídeos
      if (filteredVideos.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-video-slash"></i>
            <h3>Nenhuma meditação encontrada</h3>
            <p>Tente ajustar os filtros ou termos de busca</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filteredVideos.map(video => `
        <div class="video-card" data-id="${video.id}">
          <div class="video-thumbnail">
            <i class="fas fa-play-circle"></i>
            <div class="video-duration">${video.duracao}</div>
            <div class="video-category">${video.categoria}</div>
          </div>
          <div class="video-info">
            <h3 class="video-title">${video.titulo}</h3>
            <p class="video-description">${video.descricao}</p>
            <div class="video-meta">
              <span><i class="far fa-calendar"></i> ${formatDate(video.data)}</span>
              <span><i class="fas fa-tag"></i> ${video.categoria}</span>
            </div>
            <button class="play-btn" onclick="playVideo(${video.id})">
              <i class="fas fa-play"></i> Assistir Agora
            </button>
          </div>
        </div>
      `).join('');
    }

    function renderCategories() {
      const categoriesContainer = document.getElementById('categoriesContainer');
      const categories = [...new Set(allVideos.map(video => video.categoria))];
      
      categoriesContainer.innerHTML = `
        <button class="category-btn ${currentCategory === '' ? 'active' : ''}" 
                onclick="setCategory('')">
          Todas
        </button>
        ${categories.map(category => `
          <button class="category-btn ${currentCategory === category ? 'active' : ''}" 
                  onclick="setCategory('${category}')">
            ${category}
          </button>
        `).join('')}
      `;
    }

    function setCategory(category) {
      currentCategory = category;
      document.getElementById('categoryFilter').value = category;
      renderVideos();
      updateStats();
    }

    function updateStats() {
      const statsContainer = document.getElementById('statsContainer');
      let filteredVideos = [...allVideos];

      if (currentSearch) {
        filteredVideos = filteredVideos.filter(video => 
          video.titulo.toLowerCase().includes(currentSearch.toLowerCase()) ||
          video.descricao.toLowerCase().includes(currentSearch.toLowerCase())
        );
      }

      if (currentCategory) {
        filteredVideos = filteredVideos.filter(video => 
          video.categoria === currentCategory
        );
      }

      if (currentDuration) {
        if (currentDuration === '30 seg') {
          filteredVideos = filteredVideos.filter(video => video.duracao === '30 seg');
        } else if (currentDuration === '1 min') {
          filteredVideos = filteredVideos.filter(video => video.duracao === '1 min');
        } else if (currentDuration === '2 min') {
          filteredVideos = filteredVideos.filter(video => video.duracao === '2 min');
        } else if (currentDuration === '5 min') {
          filteredVideos = filteredVideos.filter(video => 
            video.duracao === '5 min' || parseInt(video.duracao) >= 5
          );
        }
      }

      const totalDuration = filteredVideos.reduce((total, video) => {
        const minutes = parseInt(video.duracao);
        return total + (isNaN(minutes) ? 0 : minutes);
      }, 0);

      statsContainer.innerHTML = `
        <div class="stat-item">
          <i class="fas fa-video"></i> ${filteredVideos.length} meditações
        </div>
        <div class="stat-item">
          <i class="fas fa-clock"></i> ${totalDuration} min total
        </div>
        <div class="stat-item">
          <i class="fas fa-tags"></i> ${[...new Set(filteredVideos.map(v => v.categoria))].length} categorias
        </div>
      `;
    }

    function formatDate(dateString) {
      try {
        const date = new Date(dateString);
        return date.toLocaleDateString('pt-BR');
      } catch (error) {
        return dateString;
      }
    }

    function playVideo(videoId) {
      const video = allVideos.find(v => v.id === videoId);
      if (!video) return;

      const modal = document.getElementById('videoModal');
      const playerContainer = document.getElementById('videoPlayerContainer');
      const modalInfo = document.getElementById('videoModalInfo');

      // Verificar se é um vídeo do YouTube ou upload local
      let playerHTML = '';
      if (video.tipo === 'upload' && video.url) {
        // Vídeo upload local
        playerHTML = `
          <video class="video-player" controls autoplay>
            <source src="${video.url}" type="video/mp4">
            Seu navegador não suporta o elemento de vídeo.
          </video>
        `;
      } else {
        // Vídeo do YouTube
        playerHTML = `
          <iframe 
            class="video-player"
            src="${video.url}" 
            title="${video.titulo}"
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
          </iframe>
        `;
      }

      playerContainer.innerHTML = playerHTML;

      modalInfo.innerHTML = `
        <h2 class="video-modal-title">${video.titulo}</h2>
        <p class="video-modal-description">${video.descricao}</p>
        <div style="margin-top: 1rem; display: flex; gap: 1rem; font-size: 0.9rem; opacity: 0.8;">
          <span><i class="fas fa-clock"></i> ${video.duracao}</span>
          <span><i class="fas fa-tag"></i> ${video.categoria}</span>
          <span><i class="far fa-calendar"></i> ${formatDate(video.data)}</span>
        </div>
      `;

      modal.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }

    function closeVideoModal() {
      const modal = document.getElementById('videoModal');
      const playerContainer = document.getElementById('videoPlayerContainer');
      
      modal.style.display = 'none';
      document.body.style.overflow = 'auto';
      
      // Para o vídeo
      playerContainer.innerHTML = '';
    }

    function showErrorMessage(message) {
      const container = document.getElementById('videosContainer');
      container.innerHTML = `
        <div class="empty-state">
          <i class="fas fa-exclamation-triangle"></i>
          <h3>Erro ao carregar</h3>
          <p>${message}</p>
          <button class="play-btn" onclick="loadVideosFromServer()" style="margin-top: 1rem; width: auto;">
            <i class="fas fa-redo"></i> Tentar Novamente
          </button>
        </div>
      `;
    }

    // Fechar modal ao clicar fora
    document.getElementById('videoModal').addEventListener('click', function(e) {
      if (e.target === this) {
        closeVideoModal();
      }
    });

    // Fechar modal com ESC
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closeVideoModal();
      }
    });
  </script>
</body>
</html>
